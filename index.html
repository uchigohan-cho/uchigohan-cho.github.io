<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEE2">
<meta name="description" content="ふたり・家族で使えるレシピ帳。今日なに食べる？の投票やリクエスト、冷蔵庫から探す、材料費の目安つきの宅飲み割り勘。登録不要・無料。">
<meta property="og:type" content="website">
<meta property="og:title" content="うちごはん帖｜ふたり・家族のレシピ帳">
<meta property="og:description" content="今日なに食べる？をみんなで決める。材料費の目安つきで、宅飲みの割り勘もすっきり。登録不要・無料。">
<meta property="og:image" content="https://uchigohan-cho.github.io/ogp.png">
<meta property="og:url" content="https://uchigohan-cho.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 15h22a11 11 0 0 1-22 0Z' fill='%23C95B3B'/%3E%3Cpath d='M3 15h26' stroke='%233B3027' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<title>うちごはん帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow kitchen-notebook column, sticky header, bottom tab bar; cards only for recipes */
:root{
  --bg:#F4EEE2; --paper:#FFFCF6; --ink:#3B3027; --sub:#857563; --line:#E3D7C4; --soft:#EFE6D6;
  --kraft:#A9814F; --olive:#62794A; --tomato:#C95B3B; --mustard:#C99328; --plum:#94607F; --sky:#5F8799; --pink:#C77A8C;
  --on-accent:#FFFCF6; --shadow:0 1px 0 rgba(80,60,30,.06),0 6px 18px -10px rgba(80,60,30,.35);
  --hand:"Klee One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1914; --paper:#29221B; --ink:#F1E7D8; --sub:#B3A38E; --line:#3E3429; --soft:#332A21;
  --kraft:#C9A06C; --olive:#8FA86E; --tomato:#E07B5B; --mustard:#E0AE4C; --plum:#BE87A8; --sky:#86AFC2; --pink:#DE97A8;
  --on-accent:#1E1914; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1E1914; --paper:#29221B; --ink:#F1E7D8; --sub:#B3A38E; --line:#3E3429; --soft:#332A21;
  --kraft:#C9A06C; --olive:#8FA86E; --tomato:#E07B5B; --mustard:#E0AE4C; --plum:#BE87A8; --sky:#86AFC2; --pink:#DE97A8;
  --on-accent:#1E1914; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px dashed var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--hand);font-size:21px;white-space:nowrap;letter-spacing:.06em;margin:0;line-height:1.1;display:flex;align-items:center;gap:6px}
.logo svg{width:26px;height:26px}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);white-space:nowrap}
@media (max-width:480px){.who .wl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
[hidden]{display:none!important}
.who select{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--ink)}
.iconbtn{border:none;background:none;padding:6px;border-radius:10px;color:var(--sub);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.demo{font-size:12px;color:var(--sub);background:var(--soft);border-radius:10px;padding:6px 12px;margin:12px 0 0;display:flex;gap:8px;align-items:center}
.demo b{color:var(--ink);font-weight:700}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:none;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;white-space:nowrap;color:var(--sub);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--tomato);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--tomato);color:var(--on-accent);font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* type */
h2.sec{font-family:var(--hand);font-size:20px;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
h2.sec small{font-family:var(--body);font-size:12px;color:var(--sub);font-weight:400}
.hint{font-size:12px;color:var(--sub)}
.muted{color:var(--sub)}

/* chips & controls */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:14px 0 10px}
.search svg{width:18px;height:18px;color:var(--sub);flex:none}
.search input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.filters{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:8px;min-width:0}
.frow>span{font-size:11px;color:var(--sub);flex:none;width:48px;white-space:nowrap}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--tomato);color:var(--on-accent)}
.btn.olive{background:var(--olive);color:var(--on-accent)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* recipe grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:none;padding:0;text-align:left;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:4/3;width:100%;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .plate{width:46%;aspect-ratio:1;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--paper) 70%,transparent),0 4px 10px -4px rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--hand);font-size:clamp(18px,6vw,30px);color:var(--sub)}
.ph .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;color:var(--on-accent)}
.ph .sample{position:absolute;right:8px;top:8px;font-size:10px;padding:0 6px;border-radius:6px;background:var(--paper);color:var(--sub)}
.card .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .nm{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:2px}
.hearts{display:flex;gap:2px;font-size:12px}
.empty{text-align:center;padding:40px 16px;color:var(--sub);background:var(--paper);border-radius:var(--r);border:1px dashed var(--line);margin-top:14px}
.empty b{display:block;font-family:var(--hand);font-size:18px;color:var(--ink);margin-bottom:4px}

/* sheet (detail / editor) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px dashed var(--line)}
.sheet-bar .t{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-in{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
.hero{margin:0 -16px;aspect-ratio:16/10;max-width:calc(100% + 32px)}
.dname{font-family:var(--hand);font-size:26px;line-height:1.3;margin:14px 0 4px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);margin:12px 0}
.facts div{padding:8px 4px;text-align:center;border-right:1px dashed var(--line);min-width:0}
.facts div:last-child{border-right:none}
.facts small{display:block;font-size:10.5px;color:var(--sub)}
.facts b{font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.heartrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.hbtn{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px;display:inline-flex;gap:4px;align-items:center}
.hbtn[aria-pressed="true"]{border-color:var(--pink);color:var(--pink);font-weight:700}
.panel{background:var(--paper);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14.5px}
.ings li:last-child{border-bottom:none}
.ings .amt{color:var(--sub);text-align:right}
.ings .yen{font-size:11.5px;color:var(--sub);min-width:46px;text-align:right}
.ings .yen.est::before{content:"約"}
.ings li.have .nm2{color:var(--sub);text-decoration:line-through}
.box{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;background:var(--paper);padding:0}
.box[aria-checked="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-accent)}
.box svg{width:14px;height:14px}
.costline{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:700}
.costline small{font-weight:400;color:var(--sub);font-size:11px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;background:var(--paper);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.steps li.done{opacity:.5}
.sn{width:28px;height:28px;border-radius:50%;border:none;background:var(--sky);color:var(--on-accent);font-weight:700;display:grid;place-items:center;font-size:14px}
.steps li.done .sn{background:var(--olive)}
.stx{overflow-wrap:anywhere}
.stools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--soft);display:inline-flex;align-items:center;gap:4px;border:none}
.pill.fire-強{background:color-mix(in srgb,var(--tomato) 22%,var(--paper));color:var(--tomato)}
.pill.fire-中{background:color-mix(in srgb,var(--mustard) 25%,var(--paper));color:var(--kraft)}
.pill.fire-弱{background:color-mix(in srgb,var(--sky) 20%,var(--paper));color:var(--sky)}
.pill.timer.run{background:var(--tomato);color:var(--on-accent)}
.tips{background:color-mix(in srgb,var(--mustard) 14%,var(--paper));border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13.5px;align-items:baseline}
.stars{color:var(--mustard);letter-spacing:1px}
.who-dot{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.who-dot i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* forms */
.f{display:flex;flex-direction:column;gap:4px;margin-top:12px;min-width:0}
.f>label,.f>.lbl{font-size:12px;color:var(--sub);font-weight:500}
.inp{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;width:100%;min-width:0;font-size:16px}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6}
.f2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.irow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 78px 32px;gap:6px;margin-top:6px;align-items:center}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr) 32px;gap:6px;margin-top:8px;align-items:start}
.srow .sub2{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.del{border:none;background:none;color:var(--sub);padding:6px;display:grid;place-items:center}
.del svg{width:18px;height:18px}
.photo-drop{border:1.5px dashed var(--line);border-radius:var(--r);aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;color:var(--sub);background:var(--paper);overflow:hidden;position:relative}
.photo-drop img{width:100%;height:100%;object-fit:cover}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* today */
.req{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);margin-bottom:8px}
.req .th{width:44px;height:44px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.req .th img{width:100%;height:100%;object-fit:cover}
.req .nm{font-weight:700;overflow-wrap:anywhere}
.req .msg{font-size:12.5px;color:var(--sub)}
.vote{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dotted var(--line)}
.vote:last-child{border-bottom:none}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--tomato);border-radius:3px}
.vbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700}
.vbtn[aria-pressed="true"]{background:var(--tomato);border-color:var(--tomato);color:var(--on-accent)}
.winner{font-size:11px;background:var(--mustard);color:var(--on-accent);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:700}
.roulette{display:grid;gap:8px}
.rslot{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-height:56px}
.rslot .cat{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;color:var(--on-accent);text-align:center}
.rslot .rname{font-weight:700;overflow-wrap:anywhere}
.rslot .rname.spin{color:var(--sub)}
.rslot .rname button{border:none;background:none;padding:0;font-weight:700;text-align:left;text-decoration:underline dotted;text-underline-offset:4px}

/* party */
.split{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-top:10px}
.big{font-family:var(--hand);font-size:34px;line-height:1.2}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable td{padding:6px 0;border-bottom:1px dotted var(--line);vertical-align:top}
.ptable td:last-child{text-align:right;white-space:nowrap}
.ptable tr.sum td{border-bottom:none;border-top:2px solid var(--ink);font-weight:700;padding-top:8px}
.settle{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.settle li{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 32px;gap:6px;margin-top:6px;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.stepper button{border:none;background:none;width:34px;height:34px;font-size:18px}
.stepper span{min-width:42px;text-align:center;font-weight:700}
.copybox{width:100%;min-height:150px;font-size:13px}

/* fridge */
.match{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;background:var(--paper);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);margin-bottom:8px;border:none;text-align:left;width:100%}
.match .th{width:52px;height:52px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.match .th img{width:100%;height:100%;object-fit:cover}
.lvl{font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;color:var(--on-accent);margin-right:6px}
.need{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}

/* toast & confirm */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,15,10,.45);display:grid;place-items:end center;padding:16px}
.modal .card2{background:var(--paper);border-radius:18px;padding:18px;width:100%;max-width:440px;margin-bottom:env(safe-area-inset-bottom,0px)}
.modal h3{font-family:var(--hand);margin:0 0 6px;font-size:19px}
hr.dash{border:none;border-top:1px dashed var(--line);margin:18px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
body{margin:0} img{max-width:100%}
a{color:var(--tomato)}
.hh{margin:14px 0 0;font-family:var(--hand);font-size:17px;display:flex;align-items:center;gap:8px}
.hh span{display:inline-flex;gap:3px}.hh i{width:10px;height:10px;border-radius:50%;display:inline-block}
.welcome{padding-block:28px 40px;display:flex;flex-direction:column;gap:16px}
.w-eyebrow{margin:0;color:var(--olive);font-weight:700;font-size:13px;letter-spacing:.08em}
.w-title{font-family:var(--hand);font-size:clamp(26px,7.5vw,38px);line-height:1.35;margin:0;text-wrap:balance}
.w-lead{margin:0;color:var(--sub);max-width:34em}
.w-err{margin:0;background:color-mix(in srgb,var(--tomato) 14%,var(--paper));color:var(--tomato);padding:10px 12px;border-radius:10px;font-size:14px}
.w-cta{display:flex;flex-direction:column;gap:8px}
.w-cta .btn{padding:14px 16px;font-size:16px}
.w-feats{list-style:none;margin:8px 0;padding:0;display:grid;gap:10px}
.w-feats li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;background:var(--paper);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.w-feats b{display:block}.w-feats span:not(.w-n){color:var(--sub);font-size:13.5px}
.w-n{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--kraft)}
</style>
</head>
<body>

<header class="top">

    if (!doc.exists) { fail('gone'); return; }
    const d = doc.data();
    for (const f of HFIELDS) { const j = JSON.stringify(d[f] ?? null); if (!gotH || JSON.stringify(S[f] ?? null) === base.h[f]) { S[f] = clean(d[f]) ?? S[f]; } base.h[f] = j; }
    if (!S.members.some(m => m.id === S.me)) S.me = S.members[0]?.id;
    if (S.vote?.date !== today()) { S.vote = {date:today(), items:[]}; save(); }
    gotH = true; refresh();
  }, fail));
  unsub.push(h.collection('recipes').onSnapshot(qs => {
    const dirty = dirtyColl(S.recipes, base.r), removed = new Set(Object.keys(base.r).filter(id => !S.recipes.some(r => r.id === id)));
    base.r = {}; const list = [];
    qs.docs.forEach(doc => { const r = doc.data(); base.r[r.id] = JSON.stringify(r); if (removed.has(r.id)) return; list.push(dirty[r.id] || r); });
    for (const id in dirty) if (!list.some(r => r.id === id)) list.push(dirty[id]);
    S.recipes = list; refresh();
  }, fail));
  unsub.push(h.collection('requests').onSnapshot(qs => {
    const dirty = dirtyColl(S.requests, base.q);
    base.q = {}; const list = [];
    qs.docs.forEach(doc => { const q = doc.data(); base.q[q.id] = JSON.stringify(q); list.push(dirty[q.id] || q); });
    for (const id in dirty) if (!list.some(q => q.id === id)) list.push(dirty[id]);
    S.requests = list.sort((a, b) => (b.ts || 0) - (a.ts || 0)); refresh();
  }, fail));
}

}

/* timers */
const timers = {};
let audioCtx;
function beep(){
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.2, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .3); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .3); });
  } catch(e){}
  try { navigator.vibrate?.([200, 100, 200]); } catch(e){}
}
function toggleTimer(btn){
  const key = UI.detail + btn.dataset.timer;
  if (timers[key]) { clearInterval(timers[key].iv); delete timers[key]; btn.classList.remove('run'); btn.querySelector('span').textContent = btn.dataset.min + '分'; return; }
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); } catch(e){}
  const end = Date.now() + Number(btn.dataset.min) * 60000;
  btn.classList.add('run');
  const tick = () => {
    const left = Math.max(0, end - Date.now()), m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    const live = document.querySelector(`[data-timer="${btn.dataset.timer}"]`);
    if (live) live.querySelector('span').textContent = `${m}:${String(s).padStart(2, '0')}`;
    if (!left) { clearInterval(timers[key].iv); delete timers[key]; beep(); toast('タイマーが終わりました'); if (live) { live.classList.remove('run'); live.querySelector('span').textContent = btn.dataset.min + '分'; } }
  };
  timers[key] = {iv:setInterval(tick, 500)}; tick();
}

function parsePaste(text){
  const lines = z2h(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let mode = 'head', out = {ings:[], steps:[], tips:[]}, name = '';
  for (const raw of lines) {
    const l = raw.replace(/^[■□●◆◇・＊*#【\[]+|[】\]]+$/g, '').trim();
    if (/^(材料|食材|用意するもの)/.test(l)) { mode = 'ing'; const m = l.match(/(\d+)\s*人/); if (m) out.serv = Number(m[1]); continue; }
    if (/^(作り方|手順|つくり方|調理方法)/.test(l)) { mode = 'step'; continue; }
    if (/^(コツ|ポイント|メモ|tips)/i.test(l)) { mode = 'tip'; continue; }
    if (mode === 'head') {
      if (!name) { name = l.replace(/[（(]\s*\d+\s*人分\s*[)）]/, '').trim(); const m = l.match(/(\d+)\s*人/); if (m) out.serv = Number(m[1]); }
      continue;
    }
    if (mode === 'ing') {
      const m = l.replace(/^[・\-–—]\s*/, '').match(/^(.+?)[\s…:：.．]+([^\s…:：]+.*)$/) || l.match(/^(.+?)((?:大さじ|小さじ|\d|½|少々|適量|ひとつまみ).*)$/);
      if (m) out.ings.push({n:m[1].replace(/[…:：.．]+$/, '').trim(), a:m[2].trim(), p:''});
      else out.ings.push({n:l, a:'', p:''});
      continue;
    }
    if (mode === 'step') {
      const t = l.replace(/^(\d+|[①-⑳])[.)．、）\s]*/, '').trim();
      const m = t.match(/(\d+)\s*分/);
      const fire = /強火/.test(t) ? '強' : /中火/.test(t) ? '中' : /弱火/.test(t) ? '弱' : '';
      if (t) out.steps.push({t, min:m ? Number(m[1]) : '', fire});
      continue;
    }
    if (mode === 'tip') out.tips.push(l);
  }
  return {name, ...out};
}

/* ---------- fridge ---------- */
function allIngNames(){
  const s = new Map();
  for (const r of S.recipes) for (const i of r.ings) { const n = normIng(i.n); if (n && n !== '水') s.set(n, (s.get(n) || 0) + 1); }
  for (const n of S.fridge) if (!s.has(n)) s.set(n, 0);
  return [...s.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
const isPantry = n => /^(塩|こしょう|胡椒|しょうゆ|醤油|砂糖|みりん|酒|酢|油|ごま油|サラダ油|みそ|味噌)$/.test(n);
function vFridge(){
  const names = allIngNames();
  const have = new Set(S.fridge);
  const res = S.recipes.map(r => {
    const need = r.ings.map(i => normIng(i.n)).filter(n => n && n !== '水' && !have.has(n) && !(UI.pantry !== false && isPantry(n)));
    const uniq = [...new Set(need)];
    const cost = r.ings.filter(i => uniq.includes(normIng(i.n))).reduce((a, i) => a + (ingPrice(i)?.v || 0), 0);
    const hit = r.ings.filter(i => have.has(normIng(i.n))).length;
    return {r, need:uniq, cost, hit};
  }).filter(x => x.hit > 0 || !have.size).sort((a, b) => a.need.length - b.need.length || b.hit - a.hit);
  const lvl = n => n === 0 ? ['全部そろう', 'var(--olive)'] : n <= 2 ? [`あと${n}つ`, 'var(--mustard)'] : [`あと${n}つ`, 'var(--sub)'];
  return `
  <h2 class="sec">冷蔵庫にあるもの <small>タップで選ぶ</small></h2>

/* ---------- party ---------- */
function partyCalc(){
  const P = S.party;
  const rows = P.rids.map(byId).filter(Boolean).map(r => { const c = recipeCost(r); const scale = P.people / (r.serv || 1); return {r, scale, cost:c.sum * scale}; });
  const food = rows.reduce((a, x) => a + x.cost, 0);
  const extra = P.extras.reduce((a, e) => a + (Number(e.p) || 0), 0);
  const total = food + extra;
  return {rows, food, extra, total, per: P.people ? total / P.people : 0};
}
function settle(payers, people){
  const list = payers.filter(p => p.name || Number(p.amt) > 0).map((p, i) => ({name:p.name || `立て替え${i + 1}`, amt:Number(p.amt) || 0}));
  const paid = list.reduce((a, p) => a + p.amt, 0);
  if (!paid) return null;
  people = Math.max(people, list.length);
  const share = paid / people, others = people - list.length;
  const credit = list.map(p => ({name:p.name, bal:p.amt - share})).filter(p => p.bal > 0.5);
  const debt = list.map(p => ({name:p.name, bal:share - p.amt})).filter(p => p.bal > 0.5);
  for (let i = 0; i < others; i++) debt.push({name:null, bal:share});
  const lines = []; let ci = 0;
  for (const d of debt) {
    while (d.bal > 0.5 && ci < credit.length) {
      const c = credit[ci], x = Math.min(c.bal, d.bal);
      lines.push({from:d.name, to:c.name, amt:x});
      c.bal -= x; d.bal -= x; if (c.bal <= 0.5) ci++;
    }
  }
  const anon = {}, named = [];
  for (const l of lines) { if (l.from) named.push(l); else anon[l.to] = (anon[l.to] || 0) + l.amt; }
  return {paid, share, named, anon, others, people};
}

    <button class="btn olive sm" style="margin-top:8px" data-act="copyparty">${I.copy}コピーする</button>

function partyText(){
  const P = S.party, c = partyCalc(), st = settle(P.payers, P.people);

  for (const x of c.rows) t += `・${x.r.name}：約${yen10(x.cost)}円\n`;
  for (const e of P.extras) if (e.n || e.p) t += `・${e.n || 'その他'}：${yen(Number(e.p) || 0)}円\n`;
  t += `合計 約${yen10(c.total)}円 → 1人 約${yen10(c.per)}円\n`;
  if (st) {
    t += `\n【精算】実費 ${yen(st.paid)}円 → 1人 ${yen(Math.ceil(st.share))}円\n`;
    for (const [to, a] of Object.entries(st.anon)) t += `・立て替えていない人は ${to} に ${yen(Math.ceil(a / st.others))}円\n`;

  }
  t += `\n（うちごはん帖で計算 ${SITE}）`;
  return t;
}

function ask(title, body, okLabel, fn){
  const d = document.createElement('div');
  d.className = 'modal'; d.innerHTML = `<div class="card2" role="alertdialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p class="muted" style="margin:0 0 14px">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-m="no">やめる</button><button class="btn primary" data-m="ok">${esc(okLabel)}</button></div></div>`;
  d.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (e.target === d || b) { d.remove(); if (b?.dataset.m === 'ok') fn(); } });
  document.body.appendChild(d); d.querySelector('[data-m="ok"]').focus();
}
function askText(title, ph, okLabel, fn){
  const d = document.createElement('div');
  d.className = 'modal'; d.innerHTML = `<div class="card2"><h3>${esc(title)}</h3><input class="inp" id="asktext" placeholder="${esc(ph)}" maxlength="60"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" data-m="no">やめる</button><button class="btn primary" data-m="ok">${esc(okLabel)}</button></div></div>`;
  d.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (e.target === d || b) { const v = d.querySelector('#asktext').value; d.remove(); if (b?.dataset.m === 'ok') fn(v.trim()); } });
  document.body.appendChild(d); d.querySelector('#asktext').focus();
}
let toastT;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
}
async function copy(text, el){
  try { await navigator.clipboard.writeText(text); toast('コピーしました'); }
  catch(e){ if (el) { el.focus(); el.select(); } toast('選択したので長押しでコピーしてください'); }
}

/* ---------- photo ---------- */
function compress(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .72));
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

const commit = () => { save(); render(); };
const reDetail = () => { save(); const y = document.querySelector('.sheet')?.scrollTop; openDetail(UI.detail); const s = document.querySelector('.sheet'); if (s && y) s.scrollTop = y; };

function spin(cat, done){
  const pool = S.recipes.filter(r => r.cat === cat);
  if (!pool.length) return done(null);
  const el = document.getElementById('slot-' + cat);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  if (reduce || !el || pool.length < 2) return done(pick);
  let i = 0; el.classList.add('spin');
  const iv = setInterval(() => { el.textContent = pool[i++ % pool.length].name; if (i > 9) { clearInterval(iv); el.classList.remove('spin'); done(pick); } }, 70);
}

    case 'joinnew': {
      const nm = document.getElementById('j-name').value.trim();
      if (!nm) { toast('名前を入れてください'); document.getElementById('j-name').focus(); break; }
      t.disabled = true; joinHousehold(UI.joinHid, null, nm).catch(err => { console.error(err); t.disabled = false; toast('参加できませんでした。もう一度ためしてください'); });
      break;
    }
    case 'invite': copy(`「${S.name}」に招待するね！うちごはん帖で一緒にレシピを管理しよう。\nここから参加してね → ${SITE}?join=${HID}`, document.getElementById('invite')); break;
    case 'share': try { await navigator.share({title:'うちごはん帖', text:`「${S.name}」に招待するね！ここから参加してね`, url:`${SITE}?join=${HID}`}); } catch(e){} break;
    case 'leave': ask('この端末でログアウトしますか？', 'レシピ帳は消えません。もう一度入るときは招待リンクが必要です。先に招待リンクをコピーしておいてください。', 'ログアウト', leaveDevice); break;
    case 'deletehh': ask('レシピ帳をまるごと削除しますか？', '家族全員のレシピ・写真・記録がすべて消えます。元に戻せません。', '削除する', () => deleteHousehold().catch(err => { console.error(err); toast('削除できませんでした'); })); break;
    case 'close': closeLayer(); break;
    case 'new': openEditor(); break;
    case 'edit': openEditor(d.id); break;
    case 'canceledit': openDetail(draft.id); break;
    case 'adding': draft.ings.push({n:'',a:'',p:''}); drawEditor(!!byId(draft.id)); document.getElementById('i-n-' + (draft.ings.length - 1))?.focus(); break;
    case 'addstep': draft.steps.push({t:'',min:'',fire:''}); drawEditor(!!byId(draft.id)); document.getElementById('s-t-' + (draft.steps.length - 1))?.focus(); break;
    case 'rmphoto': draft.photo = ''; drawEditor(!!byId(draft.id)); break;
    case 'parse': {
      const p = parsePaste(document.getElementById('paste').value);
      if (!p.ings.length && !p.steps.length) { toast('「材料」「作り方」の見出しがある文章だと振り分けられます'); break; }
      if (p.name) draft.name = p.name; if (p.serv) draft.serv = p.serv;
      if (p.ings.length) draft.ings = p.ings; if (p.steps.length) draft.steps = p.steps;
      if (p.tips.length) draft.tips = p.tips.join('\n');
      const cook = p.steps.reduce((a, s) => a + (Number(s.min) || 0), 0); if (cook && !draft.cook) draft.cook = cook;
      drawEditor(false); toast(`材料${p.ings.length}品・手順${p.steps.length}つを入れました`); break;
    }
    case 'saverecipe': {
      if (!draft.name.trim()) { toast('料理名を入れてください'); document.getElementById('e-name')?.focus(); break; }
      draft.ings = draft.ings.filter(i => i.n.trim()); draft.steps = draft.steps.filter(s => s.t.trim());
      draft.serv = Number(draft.serv) || 1; draft.sample = false;
      const k = S.recipes.findIndex(r => r.id === draft.id);
      if (k >= 0) S.recipes[k] = draft; else S.recipes.unshift(draft);
      save(); openDetail(draft.id); toast('保存しました'); break;
    }
    case 'delrecipe': ask('このレシピを消しますか？', `「${draft.name}」と作った記録が消えます。元に戻せません。`, '消す', () => {
      S.recipes = S.recipes.filter(r => r.id !== draft.id); S.vote.items = S.vote.items.filter(v => v.rid !== draft.id); S.party.rids = S.party.rids.filter(x => x !== draft.id); S.requests = S.requests.filter(q => q.rid !== draft.id); save(); closeLayer(); toast('消しました'); }); break;
    case 'request': askText('相手にひとこと（任意）', '例：寒いからあったかいのがいい', 'リクエストを送る', note => {
      S.requests.unshift({id:uid(), rid:d.id, from:S.me, date:today(), note, done:false, ts:Date.now()}); save(); toast('リクエストを送りました（相手の「今日なに食べる」に届きます）'); }); break;
    case 'addvote': if (!S.vote.items.some(v => v.rid === d.id)) S.vote.items.push({rid:d.id, votes:[S.me]}); save(); toast('今日の候補に入れて、1票入れました'); break;
    case 'log': { const r = byId(d.id); r.logs.push({date:today(), by:UI.logby || S.me, rate:UI.lograte || 4, memo:document.getElementById('logmemo').value.trim()}); reDetail(); toast('記録しました'); break; }
    case 'clearvote': ask('候補をリセットしますか？', '今日の候補と投票が消えます。', 'リセット', () => { S.vote.items = []; commit(); }); break;
    case 'randall': {
      if (!UI.randCats.length) { toast('種類を1つ以上選んでください'); break; }
      let left = UI.randCats.length;
      UI.randCats.forEach(k => spin(k, r => { UI.rand[k] = r?.id; if (--left === 0) render(); }));
      break;
    }
    case 'copyshop': {
      const rs = shopSource(), have = new Set(S.fridge), seen = new Set(); let t = '【買い物リスト】\n';
      for (const r of rs) for (const i of r.ings) { const n = normIng(i.n); if (!n || n === '水' || have.has(n) || seen.has(n) || S.shop[n]) continue; seen.add(n); t += `□ ${n}\n`; }
      copy(t + `（${rs.map(r => r.name).join('・')}）`); break;
    }
    case 'fradd': { const el = document.getElementById('frnew'); const v = el.value.trim(); if (v && !S.fridge.includes(v)) S.fridge.push(v); commit(); break; }
    case 'frclear': S.fridge = []; commit(); break;
    case 'pantry': UI.pantry = UI.pantry === false; render(); break;
    case 'exadd': S.party.extras.push({id:uid(), n:'', p:''}); commit(); break;
    case 'pyadd': S.party.payers.push({name:'', amt:''}); commit(); document.getElementById('py-n-' + (S.party.payers.length - 1))?.focus(); break;
    case 'copyparty': copy(partyText(), document.getElementById('partytext')); break;
    case 'memadd': S.members.push({id:uid(), name:'家族' + (S.members.length + 1), color:['var(--olive)','var(--mustard)','var(--plum)','var(--kraft)'][S.members.length % 4]}); save(); openSettings(); render(); break;
    case 'delsamples': ask('サンプルを消しますか？', '「サンプル」と付いたレシピがすべて消えます。', '消す', () => { const ids = new Set(S.recipes.filter(r => r.sample).map(r => r.id)); S.recipes = S.recipes.filter(r => !r.sample); S.vote.items = S.vote.items.filter(v => !ids.has(v.rid)); S.party.rids = S.party.rids.filter(x => !ids.has(x)); S.requests = S.requests.filter(q => !ids.has(q.rid)); save(); closeLayer(); toast('サンプルを消しました'); }); break;
    case 'reset': ask('最初の状態に戻しますか？', '登録したレシピや記録がすべて消えて、サンプルだけの状態になります。', '戻す', () => { S = sample(); save(); closeLayer(); toast('最初の状態に戻しました'); }); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { UI.q = el.value; render(); return; }
  if (el.closest('.sheet') && (el.dataset.k || el.dataset.ing != null || el.dataset.step != null)) { syncDraft(el); return; }
  if (el.dataset.ex != null) { S.party.extras[el.dataset.ex][el.dataset.f] = el.value; save(); refreshParty(); return; }
  if (el.dataset.py != null) { S.party.payers[el.dataset.py][el.dataset.f] = el.value; save(); refreshParty(); return; }
  if (el.dataset.mem != null) { S.members[el.dataset.mem].name = el.value || '名前なし'; save(); render(); return; }
  if (el.dataset.hhname) { S.name = el.value || 'わが家の台所'; save(); return; }
});
function refreshParty(){ // keep focus while typing numbers
  const id = document.activeElement?.id; render(); const el = id && document.getElementById(id); if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch(e){} }
}
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'me') { S.me = el.value; commit(); toast(`${meName(S.me)}として使っています`); return; }
  if (el.id === 'padd' && el.value) { S.party.rids.push(el.value); commit(); return; }
  if (el.id === 'photo' && el.files[0]) { try { draft.photo = await compress(el.files[0]); drawEditor(!!byId(draft.id)); } catch(err){ toast('この写真は読み込めませんでした。別の写真を選んでください'); } return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'frnew') { e.preventDefault(); document.querySelector('[data-act="fradd"]').click(); }
  if (e.key === 'Escape' && document.querySelector('.modal')) document.querySelector('.modal').remove();
});
document.getElementById('openSettings').addEventListener('click', () => openSettings());

boot();
</script>
</body>
